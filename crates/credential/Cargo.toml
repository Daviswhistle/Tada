[package]
name = "tada-credential"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
os-vault-tests = []

[dependencies]
tada-store = { path = "../store" }
tada-local-ipc = { path = "../local-ipc" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
getrandom = "=0.3.4"
hmac = "=0.12.1"
sha2 = "=0.10.9"
zeroize = "=1.8.2"
tokio = { version = "=1.53.1", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.189"
dbus-secret-service = { version = "=4.1.0", default-features = false, features = ["crypto-rust", "vendored"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
