[package]
name = "tada-agentd"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
process-fixtures = []

[dependencies]
tada-store = { path = "../store" }
tada-contracts = { path = "../contracts" }
tada-local-ipc = { path = "../local-ipc" }
tada-credential = { path = "../credential" }
sha2 = "=0.10.9"
serde_json = "=1.0.145"
serde = { version = "=1.0.228", features = ["derive"] }
getrandom = "=0.3.4"
tokio = { version = "=1.53.1", features = ["rt", "macros", "sync", "time", "process", "io-util", "signal"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[dev-dependencies]
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
