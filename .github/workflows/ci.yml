name: Contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  conformance:
    name: Contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Install locked Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check generated source, TypeScript and shared fixtures
        run: npm run check
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Lint Rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test contracts, durable store and process-kill recovery
        run: cargo test --workspace --locked -- --nocapture
      - name: Run disposable mock recovery example
        run: cargo run --locked -p tada-store --example recover_mock -- "${{ runner.temp }}/tada-core02-demo"
      - name: Run authenticated control replay example
        run: cargo run --locked -p tada-store --example control_replay -- "${{ runner.temp }}/tada-core03-demo"
      - name: Run two-process native IPC example
        run: cargo run --locked -p tada-local-ipc --bin tada-ipc-demo -- "${{ runner.temp }}/tada-core04-demo"
      - name: Run durable supervisor probe without task completion
        run: cargo run --locked -p tada-agentd --example supervisor_probe -- "${{ runner.temp }}/tada-core06-demo"
      - name: Reject uncommitted generated changes
        run: git diff --exit-code
  portability:
    name: Core portability (macOS; native IPC disabled)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Check workspace formatting and portability
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Unsupported native transport and identity reject before side effects
        run: |
          cargo test --locked -p tada-local-ipc --lib -- --nocapture
          cargo test --locked -p tada-credential --lib -- --nocapture
      - name: Reject uncommitted changes
        run: git diff --exit-code
  native-vault:
    name: OS vault (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Compile and lint opt-in native-vault tests
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Install Linux fixture service
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring dbus
      - name: Test isolated Linux Secret Service
        if: runner.os == 'Linux'
        run: bash scripts/test-os-vault.sh
      - name: Test Windows user Credential Manager
        if: runner.os == 'Windows'
        run: |
          cargo test --locked -p tada-credential --features os-vault-tests os_tests:: -- --nocapture --test-threads=1
      - name: Reject uncommitted changes
        run: git diff --exit-code
