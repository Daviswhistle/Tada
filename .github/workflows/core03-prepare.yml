name: Prepare CORE-03 branch
on:
  push:
    branches: [codex/core-03-control-protocol]
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor == 'Daviswhistle'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Integrate reviewed staged source
        run: python3 scripts/core03-import.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Generate contracts, lock dependencies and format
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run generate
          cargo metadata --format-version=1 > /dev/null
          cargo fmt --all
      - name: Commit prepared source only to the CORE-03 branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/codex/core-03-control-protocol
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Cargo.lock crates packages fixtures scripts
          if ! git diff --cached --quiet; then
            git commit -m 'feat(control): integrate generated contracts and formatted command protocol'
            AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/codex/core-03-control-protocol
          fi
      - name: Check prepared source
        run: |
          npm run check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked -- --nocapture
