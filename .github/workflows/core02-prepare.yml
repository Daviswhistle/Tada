name: Prepare CORE-02 branch
on:
  push:
    branches: [codex/core-02-durable-mock]
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor == 'Daviswhistle'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Apply staged source refinements
        run: python3 scripts/core02-import.py
      - name: Install pinned toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Resolve lockfile and format source
        run: |
          cargo metadata --format-version=1 > /dev/null
          cargo fmt --all
      - name: Commit only prepared CORE-02 source to this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/codex/core-02-durable-mock
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Cargo.lock crates/store scripts/core02-import.py docs/core-02.md
          if ! git diff --cached --quiet; then
            git commit -m 'fix(store): suppress superseded outbox decisions without fabricated delivery'
            AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/codex/core-02-durable-mock
          fi
