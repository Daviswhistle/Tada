name: Prepare ENGINE-01 source
on:
  push:
    branches: [codex/engine-01-duplex-boundary]
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor == 'Daviswhistle'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Apply exact-base integration
        run: |
          python3 scripts/import-engine01.py
          python3 scripts/engine01-review.py
      - name: Install pinned formatter
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Format reviewed source
        run: cargo fmt --all
      - name: Commit prepared source only to this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/codex/engine-01-duplex-boundary
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- crates/agentd crates/store/src/control/worker.rs packages/engine package.json tsconfig.json README.md docs scripts/import-engine01.py scripts/engine01-review.py
          if ! git diff --cached --quiet; then
            git commit -m 'chore(engine): integrate duplex worker transport and format reviewed source'
            AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/codex/engine-01-duplex-boundary
          fi
