name: Prepare CORE-05 source correction
on:
  push:
    branches: [codex/core-05-installation-identity]
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor == 'Daviswhistle'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Apply exact owner correction and regression cases
        run: python3 scripts/core05-import.py
      - name: Install pinned formatter
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Format sources
        run: cargo fmt --all
      - name: Commit only source and documentation on this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/codex/core-05-installation-identity
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- crates/credential/src/windows_root.rs docs/installation-identity.md scripts/core05-import.py
          git commit -m 'fix(identity): honor native Windows file owner without widening user-only access'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/codex/core-05-installation-identity
