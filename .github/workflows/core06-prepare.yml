name: Prepare CORE-06 branch
on:
  push:
    branches: [codex/core-06-durable-supervisor]
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor == 'Daviswhistle'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Apply reviewed asynchronous admission fix
        run: python3 scripts/core06-finalize.py
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Format source
        run: cargo fmt --all
      - name: Commit only reviewed source and documentation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/codex/core-06-durable-supervisor
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- crates/store/src/priority.rs crates/local-ipc/src scripts/core06-finalize.py docs/queue-supervisor.md
          if ! git diff --cached --quiet; then
            git commit -m 'fix(ipc): await priority admission without occupying blocking executor threads'
            AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/codex/core-06-durable-supervisor
          fi
      - name: Validate bounded executor and priority regressions
        run: |
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --locked -- --nocapture
