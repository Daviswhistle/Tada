name: Prepare CORE-04 branch
on:
  push:
    branches: [codex/core-04-native-ipc]
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor == 'Daviswhistle'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Apply reviewed capability and documentation updates
        run: python3 scripts/core04-import.py
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Resolve exact dependencies and format
        run: |
          cargo metadata --format-version=1 > /dev/null
          cargo fmt --all
      - name: Commit only prepared files on this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/codex/core-04-native-ipc
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Cargo.lock crates/local-ipc scripts/core04-import.py README.md docs/native-ipc.md docs/roadmap.md .github/workflows/ci.yml
          if ! git diff --cached --quiet; then
            git commit -m 'fix(ipc): keep unsupported platforms fail-closed and document native boundary'
            AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/codex/core-04-native-ipc
          fi
      - name: Validate prepared source
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked -- --nocapture
