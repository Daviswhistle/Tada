name: Prepare durable inference branch
on:
  push:
    branches: [codex/model-02-durable-ledger]
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor == 'Daviswhistle'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Apply exact-base compatibility integration
        run: python3 scripts/inference-v3-prepare.py
      - name: Format using repository toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          cargo fmt --all
      - name: Save branch integration and remove preparation files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/codex/model-02-durable-ledger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- crates/store .github/workflows/ci.yml scripts/inference-v3-prepare.py .github/workflows/model-ledger-prepare.yml
          git commit -m 'fix(model): require backed-up v3 accounting semantics and share internal JSON parsing'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/codex/model-02-durable-ledger
